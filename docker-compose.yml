services:

  # ── PostgreSQL + PostGIS ───────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.5
    container_name: aeroguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-aeroguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeroguard}
      POSTGRES_DB:       ${POSTGRES_DB:-aeroguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aeroguard-net
    ports:
      - "5432:5432"   # expose for local DB clients; remove in production
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-aeroguard} -d ${POSTGRES_DB:-aeroguard}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: aeroguard-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - aeroguard-net
    ports:
      - "6379:6379"   # expose for local Redis clients; remove in production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Mosquitto MQTT broker ──────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: aeroguard-mosquitto
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - aeroguard-net
    ports:
      - "1883:1883"   # standard MQTT
      - "9001:9001"   # MQTT over WebSocket

  # ── OSRM one-time download (Maharashtra OSM extract) ─────────────────────
  osrm-download:
    image: alpine:3.20
    container_name: aeroguard-osrm-download
    restart: "no"
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        mkdir -p /data
        if [ -f /data/maharashtra-latest.osrm ]; then
          echo "OSRM dataset already fully prepared, skipping download."
          exit 0
        fi
        if [ -f /data/maharashtra-latest.osm.pbf ]; then
          # If previous run stored an HTML/error page, remove it.
          if head -c 1024 /data/maharashtra-latest.osm.pbf | tr -d '\000' | grep -Eiq '<html|<!doctype html|not found'; then
            rm -f /data/maharashtra-latest.osm.pbf
          fi
          # Remove obviously invalid tiny files.
          if [ -f /data/maharashtra-latest.osm.pbf ] && [ "$(wc -c < /data/maharashtra-latest.osm.pbf)" -lt 10000000 ]; then
            rm -f /data/maharashtra-latest.osm.pbf
          fi
        fi
        if [ ! -f /data/maharashtra-latest.osm.pbf ]; then
          apk add --no-cache wget ca-certificates
          wget -O /data/maharashtra-latest.osm.pbf.tmp https://download.openstreetmap.fr/extracts/asia/india/maharashtra.osm.pbf
          # Validate download before publish.
          if head -c 1024 /data/maharashtra-latest.osm.pbf.tmp | tr -d '\000' | grep -Eiq '<html|<!doctype html|not found'; then
            echo "Downloaded file is HTML, not OSM PBF" >&2
            rm -f /data/maharashtra-latest.osm.pbf.tmp
            exit 1
          fi
          if [ "$(wc -c < /data/maharashtra-latest.osm.pbf.tmp)" -lt 10000000 ]; then
            echo "Downloaded file is too small to be a valid regional OSM extract" >&2
            rm -f /data/maharashtra-latest.osm.pbf.tmp
            exit 1
          fi
          mv /data/maharashtra-latest.osm.pbf.tmp /data/maharashtra-latest.osm.pbf
        fi
    volumes:
      - ./docker/osrm/data:/data
    networks:
      - aeroguard-net

  # ── OSRM extract graph using car profile ──────────────────────────────────
  osrm-extract:
    image: osrm/osrm-backend
    container_name: aeroguard-osrm-extract
    restart: "no"
    command: >
      osrm-extract -p /opt/car.lua /data/maharashtra-latest.osm.pbf
    volumes:
      - ./docker/osrm/data:/data
    networks:
      - aeroguard-net
    depends_on:
      osrm-download:
        condition: service_completed_successfully

  # ── OSRM MLD partition preprocessing ──────────────────────────────────────
  osrm-partition:
    image: osrm/osrm-backend
    container_name: aeroguard-osrm-partition
    restart: "no"
    command: >
      osrm-partition /data/maharashtra-latest.osrm
    volumes:
      - ./docker/osrm/data:/data
    networks:
      - aeroguard-net
    depends_on:
      osrm-extract:
        condition: service_completed_successfully

  # ── OSRM MLD customize preprocessing ──────────────────────────────────────
  osrm-customize:
    image: osrm/osrm-backend
    container_name: aeroguard-osrm-customize
    restart: "no"
    command: >
      osrm-customize /data/maharashtra-latest.osrm
    volumes:
      - ./docker/osrm/data:/data
    networks:
      - aeroguard-net
    depends_on:
      osrm-partition:
        condition: service_completed_successfully

  # ── OSRM routing server (MLD) ─────────────────────────────────────────────
  osrm:
    image: osrm/osrm-backend
    container_name: aeroguard-osrm
    restart: unless-stopped
    depends_on:
      osrm-customize:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    volumes:
      - ./docker/osrm/data:/data
    command: >
      osrm-routed --algorithm mld /data/maharashtra-latest.osrm
    networks:
      - aeroguard-net

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: aeroguard-api
    restart: unless-stopped
    environment:
      APP_ENV:                  ${APP_ENV:-development}
      DEBUG:                    ${DEBUG:-true}
      POSTGRES_HOST:            postgres
      POSTGRES_PORT:            "5432"
      POSTGRES_USER:            ${POSTGRES_USER:-aeroguard}
      POSTGRES_PASSWORD:        ${POSTGRES_PASSWORD:-aeroguard}
      POSTGRES_DB:              ${POSTGRES_DB:-aeroguard}
      REDIS_HOST:               redis
      REDIS_PORT:               "6379"
      MQTT_BROKER_HOST:         mosquitto
      MQTT_BROKER_PORT:         "1883"
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      OPENROUTESERVICE_BASE_URL: ${OPENROUTESERVICE_BASE_URL:-https://api.openrouteservice.org}
      OPENAQ_API_KEY:           ${OPENAQ_API_KEY:-}
      AQICN_API_KEY:            ${AQICN_API_KEY:-}
      OSRM_BASE_URL:            ${OSRM_BASE_URL:-http://osrm:5000}
      ROUTE_WEIGHT_POLLUTION:   ${ROUTE_WEIGHT_POLLUTION:-0.6}
      ROUTE_WEIGHT_DURATION:    ${ROUTE_WEIGHT_DURATION:-0.3}
      ROUTE_WEIGHT_DISTANCE:    ${ROUTE_WEIGHT_DISTANCE:-0.1}
    ports:
      - "8000:8000"
    networks:
      - aeroguard-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      osrm:
        condition: service_started

  # ── IoT sensor simulator ───────────────────────────────────────────────────
  simulator:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: aeroguard-simulator
    restart: unless-stopped
    # Override ENTRYPOINT so the migration script is skipped entirely;
    # the simulator only needs HTTP access to the api service.
    entrypoint: ["python", "-m", "backend.iot.run_simulator"]
    environment:
      BACKEND_BASE_URL:        http://api:8000
      SIMULATOR_INTERVAL:      "${SIMULATOR_INTERVAL:-30}"
      SIMULATOR_SENSOR_COUNT:  "${SIMULATOR_SENSOR_COUNT:-25}"
    networks:
      - aeroguard-net
    depends_on:
      api:
        condition: service_healthy

# ── Named internal network ─────────────────────────────────────────────────
networks:
  aeroguard-net:
    driver: bridge

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_logs:
