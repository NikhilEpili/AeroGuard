# ── Mosquitto MQTT broker configuration (AeroGuard) ──────────────────────────
# Mosquitto 2.0+ requires explicit listener blocks.
# Anonymous connections are permitted for internal Docker network use only.
# In production, replace allow_anonymous with password_file authentication.

# ── TCP listener (standard MQTT) ─────────────────────────────────────────────
listener 1883
allow_anonymous true

# ── WebSocket listener (browser / dashboard clients) ─────────────────────────
listener 9001
protocol websockets
allow_anonymous true

# ── Persistence ───────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
